                  <button key={s} onClick={()=>{ onStatusChange(s); setStatusOpen(false); }}
                    className="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                    <span className={`w-2 h-2 rounded-full ${STATUS_CFG[s].dot}`}/>{s}
                  </button>
                ))}
              </div>
            )}
          </div>
          <Btn variant="ghost" size="sm" className="text-red-300 hover:bg-white/15 hover:text-red-200" onClick={onDelete}>
            <I.Trash/>Delete
          </Btn>
          <button onClick={onClear} className="p-1 rounded-lg hover:bg-white/15 transition-colors"><I.X/></button>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // QUICK STATUS (inline dropdown in table)  (Phase 2)
    // ─────────────────────────────────────────────────────────────
    const QuickStatus = ({ record, onUpdate }) => {
      const [open, setOpen] = useState(false);
      const ref = useRef();
      useEffect(() => {
        const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);
      return (
        <div ref={ref} className="relative inline-block">
          <button onClick={e=>{ e.stopPropagation(); setOpen(o=>!o); }}>
            <StatusBadge status={record.progress}/>
          </button>
          {open && (
            <div className="absolute top-full mt-1 left-0 bg-white dark:bg-gray-800 rounded-xl shadow-xl border dark:border-gray-700 py-1 z-30 min-w-[140px] animate-up">
              {STATUSES.map(s=>(
                <button key={s} onClick={e=>{ e.stopPropagation(); onUpdate(s); setOpen(false); }}
                  className={`w-full text-left px-3 py-2 text-xs font-semibold flex items-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-700 ${record.progress===s?'text-[#031B4E] dark:text-blue-400':''}`}>
                  <span className={`w-2 h-2 rounded-full ${STATUS_CFG[s].dot}`}/>{s}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // WORKLOAD VIEW  (Phase 3)
    // ─────────────────────────────────────────────────────────────
    const WorkloadView = () => {
      const { state } = useApp();
      const r = state.records;

      const rows = useMemo(() => {
        return state.owners.map(o => {
          const items = r.filter(x=>x.owner===o.name);
          const bySt  = Object.fromEntries(STATUSES.map(s=>[s, items.filter(x=>x.progress===s).length]));
          const overdue = items.filter(x=>isOverdue(x.dueDate,x.progress)).length;
          const pct = items.length ? Math.round((bySt['Completed']/items.length)*100) : 0;
          return { ...o, items, total:items.length, bySt, overdue, pct };
        }).filter(o=>o.total>0).sort((a,b)=>b.total-a.total);
      }, [state.owners, r]);

      // Also include unassigned
      const unassigned = useMemo(() => {
        const items = r.filter(x=>!x.owner||!state.owners.find(o=>o.name===x.owner));
        return items.length ? items : [];
      }, [r, state.owners]);

      if (!r.length) return <EmptyState Icon={I.Grid} title="No data" desc="Add records and owners to see workload distribution."/>;

      const initials = name => name.split(' ').map(n=>n[0]||'').join('').slice(0,2).toUpperCase();

      return (
        <div className="space-y-6">
          {/* Summary cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard label="Active Owners" value={rows.length} gradient="bg-gradient-to-br from-[#031B4E] to-[#0d3080]" Icon={I.Users}/>
            <StatCard label="Unassigned Items" value={unassigned.length} gradient={`bg-gradient-to-br ${unassigned.length?'from-amber-500 to-amber-700':'from-emerald-500 to-emerald-700'}`} Icon={I.Warning}/>
            <StatCard label="Avg Items / Owner" value={rows.length?Math.round(r.length/rows.length):0} gradient="bg-gradient-to-br from-violet-500 to-violet-700" Icon={I.Target}/>
            <StatCard label="Overdue Items" value={r.filter(x=>isOverdue(x.dueDate,x.progress)).length} gradient="bg-gradient-to-br from-rose-500 to-rose-700" Icon={I.Clock}/>
          </div>

          {/* Per-owner table */}
          <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
            <div className="px-6 py-4 border-b dark:border-gray-700">
              <h3 className="font-bold text-gray-900 dark:text-white">Owner Breakdown</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-gray-50 dark:bg-gray-700/60 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                  <tr>
                    <th className="px-4 py-3 text-left">Owner</th>
                    <th className="px-4 py-3 text-center">Total</th>
                    <th className="px-4 py-3 text-center">Not Started</th>
                    <th className="px-4 py-3 text-center">In Progress</th>
                    <th className="px-4 py-3 text-center">At Risk</th>
                    <th className="px-4 py-3 text-center">Blocked</th>
                    <th className="px-4 py-3 text-center">Completed</th>
                    <th className="px-4 py-3 text-center">Overdue</th>
                    <th className="px-4 py-3 text-left w-40">Completion</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                  {rows.map(o=>(
                    <tr key={o.id} className="hover:bg-blue-50/30 dark:hover:bg-gray-700/40 transition-colors">
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2.5">
                          <div className="w-8 h-8 rounded-full bg-[#031B4E] text-white flex items-center justify-center text-xs font-black shrink-0">{initials(o.name)}</div>
                          <div><p className="font-semibold text-gray-900 dark:text-white text-sm">{o.name}</p><p className="text-xs text-gray-400">{o.department||'—'}</p></div>
                        </div>
                      </td>
                      <td className="px-4 py-3 text-center font-black text-gray-800 dark:text-gray-200">{o.total}</td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.bySt['Not Started']?'bg-gray-100 text-gray-600':'text-gray-300'}`}>{o.bySt['Not Started']||'—'}</span></td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.bySt['In Progress']?'bg-blue-100 text-blue-700':'text-gray-300'}`}>{o.bySt['In Progress']||'—'}</span></td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.bySt['At Risk']?'bg-amber-100 text-amber-700':'text-gray-300'}`}>{o.bySt['At Risk']||'—'}</span></td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.bySt['Blocked']?'bg-red-100 text-red-700':'text-gray-300'}`}>{o.bySt['Blocked']||'—'}</span></td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.bySt['Completed']?'bg-green-100 text-green-700':'text-gray-300'}`}>{o.bySt['Completed']||'—'}</span></td>
                      <td className="px-4 py-3 text-center"><span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${o.overdue?'bg-red-100 text-red-700':'text-gray-300'}`}>{o.overdue||'—'}</span></td>
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2">
                          <div className="flex-1 bg-gray-100 dark:bg-gray-700 rounded-full h-2">
                            <div className="h-2 rounded-full transition-all duration-500" style={{width:`${o.pct}%`,background:o.pct===100?'#22c55e':o.pct>50?'#3b82f6':'#f59e0b'}}/>
                          </div>
                          <span className="text-xs font-bold text-gray-600 dark:text-gray-400 w-9 text-right">{o.pct}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {unassigned.length > 0 && (
                    <tr className="bg-amber-50/40 dark:bg-amber-900/10">
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2.5">
                          <div className="w-8 h-8 rounded-full bg-amber-400 text-white flex items-center justify-center text-xs font-black shrink-0">?</div>
                          <div><p className="font-semibold text-amber-700 dark:text-amber-400 text-sm">Unassigned</p><p className="text-xs text-gray-400">No owner set</p></div>
                        </div>
                      </td>
                      <td className="px-4 py-3 text-center font-black text-amber-700">{unassigned.length}</td>
                      <td colSpan="7" className="px-4 py-3 text-xs text-amber-600 dark:text-amber-400">These records have no owner — assign them in Work Records.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // SIDEBAR + LAYOUT
    // ─────────────────────────────────────────────────────────────
    const NAV = [
      { id:'dashboard', label:'Dashboard',    Ico:I.Home     },
      { id:'records',   label:'Work Records', Ico:I.Layers   },
      { id:'workload',  label:'Workload',     Ico:I.Grid     },
      { id:'owners',    label:'Owners',       Ico:I.Users    },
      { id:'audit',     label:'Activity Log', Ico:I.History  },
      { id:'settings',  label:'Settings',     Ico:I.Settings },
    ];

    const Sidebar = ({ open, setOpen }) => {
      const { view, setView, state, dark, toggleDark } = useApp();
      const alert = state.records.filter(r=>r.progress==='At Risk'||r.progress==='Blocked'||isOverdue(r.dueDate,r.progress)).length;

      return (
        <>
          {open && <div className="fixed inset-0 bg-black/40 z-20 lg:hidden" onClick={()=>setOpen(false)}/>}
          <aside className={`fixed top-0 left-0 h-full w-60 bg-[#031B4E] text-white z-30 flex flex-col transition-transform duration-200 lg:translate-x-0 ${open?'translate-x-0':'-translate-x-full'}`}>
            {/* Logo */}
            <div className="flex items-center gap-3 px-5 py-4 border-b border-white/10">
              <svg viewBox="0 0 64 64" width="36" height="36" className="shrink-0">
                <rect width="64" height="64" rx="12" fill="#fff"/>
                <rect width="64" height="64" rx="12" fill="#031B4E"/>
                <path d="M42 8 56 6 47 48 39 36z" fill="#F71925"/>
                <text x="8" y="42" fontFamily="Arial,sans-serif" fontSize="24" fontWeight="800" fill="white">FAB</text>
              </svg>
              <div>
                <p className="font-black text-sm leading-tight">{state.settings.appTitle||'FAB Team Tracker'}</p>
                <p className="text-xs text-white/40 mt-0.5">Offline · v2.0</p>
              </div>
            </div>

            {/* Nav items */}
            <nav className="flex-1 py-4 px-2.5 space-y-0.5 overflow-y-auto">
              {NAV.map(({id,label,Ico})=>(
                <button key={id} onClick={()=>{ setView(id); setOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all
                    ${view===id?'bg-white/15 text-white':'text-white/55 hover:bg-white/8 hover:text-white'}`}>
                  <Ico/>
                  <span className="flex-1 text-left">{label}</span>
                  {id==='records' && alert>0 && <span className="bg-[#F71925] text-white text-[10px] font-black px-1.5 py-0.5 rounded-full min-w-[18px] text-center">{alert}</span>}
                </button>
              ))}
            </nav>

            {/* Footer */}
            <div className="p-3 border-t border-white/10">
              <button onClick={toggleDark} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-semibold text-white/55 hover:bg-white/8 hover:text-white transition-all">
                {dark?<I.Sun/>:<I.Moon/>}<span>{dark?'Light Mode':'Dark Mode'}</span>
              </button>
              <p className="text-[10px] text-white/25 px-3 pt-2">Data stored locally · No telemetry</p>
            </div>
          </aside>
        </>
      );
    };

    const TITLES = { dashboard:'Dashboard', records:'Work Records', workload:'Workload', owners:'Owners', audit:'Activity Log', settings:'Settings' };

    const App = () => {
      const { view, setView, state, setShowShortcuts } = useApp();
      const [sideOpen, setSideOpen] = useState(false);
      const searchRef = useRef();

      // ── Keyboard shortcuts (Phase 2) ──
      useEffect(() => {
        const handler = e => {
          const tag = document.activeElement?.tagName;
          if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
          const k = e.key.toLowerCase();
          if (k==='?')         { e.preventDefault(); setShowShortcuts(s=>!s); }
          else if (k==='d')    setView('dashboard');
          else if (k==='r')    setView('records');
          else if (k==='w')    setView('workload');
          else if (k==='o')    setView('owners');
          else if (k==='a')    setView('audit');
          else if (k==='s')    setView('settings');
          else if (k==='/')    { e.preventDefault(); searchRef.current?.focus(); }
        };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [setView, setShowShortcuts]);

      const VIEWS = {
        dashboard: <Dashboard/>,
        records:   <RecordsView searchRef={searchRef}/>,
        workload:  <WorkloadView/>,
        owners:    <OwnersView/>,
        audit:     <AuditView/>,
        settings:  <SettingsView/>,
      };

      return (
        <div className="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
          <Sidebar open={sideOpen} setOpen={setSideOpen}/>
          <div className="lg:pl-60 transition-all">
            <header className="no-print sticky top-0 z-10 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 lg:px-6 h-14 flex items-center gap-3">
              <button onClick={()=>setSideOpen(true)} className="lg:hidden p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500"><I.Menu/></button>
              <div className="flex-1">
                <h1 className="text-base font-black text-gray-900 dark:text-white">{TITLES[view]}</h1>
                <p className="text-xs text-gray-400 hidden sm:block leading-none">{state.records.length} records · {state.owners.length} owners</p>
              </div>
              <button onClick={()=>window.print()} title="Print / Save as PDF"
                className="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                <I.Print/>
              </button>
              <button onClick={()=>setShowShortcuts(true)} title="Keyboard shortcuts (?)"
                className="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                <I.Keyboard/>
              </button>
            </header>
            <main className="p-4 lg:p-6 animate-up">{VIEWS[view]}</main>
          </div>
          <Toast/>
          <ShortcutsModal/>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // MOUNT
    // ─────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App/></AppProvider>);
  </script>
</body>
</html>
